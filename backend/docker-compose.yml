services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: anti
      POSTGRES_PASSWORD: anti
      POSTGRES_DB: antipulse
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U anti -d antipulse"]
      interval: 3s
      timeout: 3s
      retries: 20

  app:
    build:
      context: ..
      dockerfile: backend/Dockerfile
    ports:
      - "8080:8080"
    # Секреты и токены — из backend/.env (как задумал напарник);
    # отсутствие файла не валит запуск (required: false).
    env_file:
      - path: .env
        required: false
    # Переменные ниже имеют приоритет над env_file:
    # внутри контейнера адрес БД — не localhost.
    environment:
      PORT: "8080"
      DATABASE_URL: postgres://anti:anti@postgres:5432/antipulse?sslmode=disable
      FRONTEND_DIST: /app/dist
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/health"]
      interval: 10s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
