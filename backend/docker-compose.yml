services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: anti
      POSTGRES_PASSWORD: anti
      POSTGRES_DB: antipulse
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U anti -d antipulse"]
      interval: 3s
      timeout: 3s
      retries: 20

  app:
    image: golang:alpine
    working_dir: /app
    volumes:
      - .:/app
    environment:
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USER=anti
      - DB_PASSWORD=anti
      - DB_NAME=antipulse
    env_file:
      - .env
    command: go run ./cmd/server/main.go
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata: