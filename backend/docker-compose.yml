services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: anti
      POSTGRES_PASSWORD: anti
      POSTGRES_DB: antipulse
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U anti -d antipulse"]
      interval: 3s
      timeout: 3s
      retries: 20

  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      PORT: "8080"
      DATABASE_URL: postgres://anti:anti@postgres:5432/antipulse?sslmode=disable
      MAX_BOT_TOKEN: ${MAX_BOT_TOKEN:-}
      MAX_MINI_APP_NAME: ${MAX_MINI_APP_NAME:-}
      MAX_MINI_APP_URL: ${MAX_MINI_APP_URL:-}
      MAX_REQUIRE_INIT_DATA: ${MAX_REQUIRE_INIT_DATA:-false}
      CORS_ORIGINS: ${CORS_ORIGINS:-}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/health"]
      interval: 10s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
